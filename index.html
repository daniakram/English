<style>
:root{
  --ink:#10151c; --ink-2:#39424e; --ink-3:#6b7380;
  --line:#d9dde3; --line-2:#eceef2;
  --bg:#f4f5f7; --card:#ffffff;
  --accent:#1f3864; --accent-soft:#eaeef6;
  --ok:#1b6b45; --ok-soft:#e7f4ee;
  --warn:#8a5a00; --warn-soft:#fdf3e0;
  --bad:#9b2226; --bad-soft:#fdeceb;
  --r:14px; --r-s:9px;
  --shadow:0 1px 2px rgba(16,21,28,.06), 0 8px 24px rgba(16,21,28,.06);
  --ar:'Cairo',system-ui,sans-serif;
  --en:'Tinos','Times New Roman',serif;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eef1f5; --ink-2:#c2c9d3; --ink-3:#8b94a1;
    --line:#2b323c; --line-2:#212831;
    --bg:#11151a; --card:#171c23;
    --accent:#b9c9ea; --accent-soft:#1b2436;
    --ok:#7fd2a8; --ok-soft:#14261e;
    --warn:#e6c07b; --warn-soft:#2a2213;
    --bad:#f2a5a2; --bad-soft:#2b1717;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ink:#eef1f5; --ink-2:#c2c9d3; --ink-3:#8b94a1;
  --line:#2b323c; --line-2:#212831;
  --bg:#11151a; --card:#171c23;
  --accent:#b9c9ea; --accent-soft:#1b2436;
  --ok:#7fd2a8; --ok-soft:#14261e;
  --warn:#e6c07b; --warn-soft:#2a2213;
  --bad:#f2a5a2; --bad-soft:#2b1717;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--ar);
  font-size:15px; line-height:1.7; -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.en{font-family:var(--en); direction:ltr; text-align:left; unicode-bidi:isolate}

/* ---------- anti-copy ---------- */
body.protect, body.protect *{
  -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
  -webkit-touch-callout:none;
}
body.protect input, body.protect textarea{
  -webkit-user-select:text; user-select:text;
}
@media print{
  html,body{background:#fff!important}
  body *{display:none!important}
  body::after{
    content:"الطباعة غير مسموحة — منصة نماذج امتحانية";
    display:block!important; padding:40px; font-size:20px; text-align:center;
  }
}

/* ---------- watermark ---------- */
#wm{
  position:fixed; inset:0; z-index:60; pointer-events:none;
  background-repeat:repeat; opacity:.13; display:none;
}
body.protect #wm{display:block}

/* ---------- blur guard ---------- */
#guard{
  position:fixed; inset:0; z-index:200; display:none;
  background:rgba(8,11,15,.92); color:#fff;
  align-items:center; justify-content:center; text-align:center; padding:28px;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}
#guard.on{display:flex}

}
.banner .ar1{font-family:'Cairo';font-weight:900;font-size:clamp(17px,4.4vw,24px);letter-spacing:-.2px}
.banner .en1{font-family:var(--en);font-variant:small-caps;letter-spacing:.06em;font-size:clamp(11px,2.6vw,14px);color:var(--ink-2);margin-top:2px}
.banner .rule{height:0;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);margin:10px auto 8px;max-width:760px;opacity:.75}
.banner .sub{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink-2);font-size:13px}
.banner .sub i{display:block;height:1px;background:var(--line);width:clamp(30px,10vw,90px)}
.banner .sub b{font-weight:700;color:var(--ink);font-size:15px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.center{max-width:520px;margin:22px auto}
h2.t{margin:0 0 4px;font-size:19px;font-weight:800}
p.s{margin:0 0 18px;color:var(--ink-3);font-size:13.5px}

label.fl{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:var(--ink-2)}
.inp{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-s);

}
.inp:focus{border-color:var(--accent);background:var(--card)}
.inp.code{font-family:var(--en);letter-spacing:.22em;text-align:center;font-size:19px;font-weight:700;text-transform:uppercase}

.btn{

:root:not([data-theme="light"]) .btn{color:#0e1420}

.btn:disabled{opacity:.5;cursor:not-allowed}

.btn.sm{width:auto;padding:8px 13px;font-size:13px;border-radius:8px}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}

.note{padding:11px 13px;border-radius:var(--r-s);font-size:13.2px;margin-top:14px;display:none}

.wa{

.rrow{

.tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;flex:none}

/* ---------- admin ---------- */
table{width:100%;border-collapse:collapse;font-size:13.2px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line-2);text-align:right;vertical-align:middle}

td.mono{font-family:var(--en);direction:ltr;text-align:left;font-weight:700;letter-spacing:.06em}

.chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}

.hide{display:none!important}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

<script>
/* ============================================================
   منصة نماذج امتحانية — اكرم محفوض ✦ هاني محفوض

/* ---------- small helpers ---------- */
const $  = (s,r)=> (r||document).querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const pad = n => String(n).padStart(2,'0');
const todayISO = ()=> new Date().toISOString().slice(0,10);
const fmtDate = d => { if(!d) return '—'; const x=new Date(d); return `${x.getFullYear()}/${pad(x.getMonth()+1)}/${pad(x.getDate())}`; };
const daysLeft = iso => Math.ceil((new Date(iso+'T23:59:59') - Date.now())/86400000);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function rndCode(){
  const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s=""; for(let i=0;i<8;i++) s+=A[Math.floor(Math.random()*A.length)];
  return s.slice(0,4)+"-"+s.slice(4);
}
function deviceId(){
  let d=null;
  try{ d=localStorage.getItem('nm_dev'); }catch(e){}
  if(!d){
    d='D'+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6);
    try{ localStorage.setItem('nm_dev',d); }catch(e){}
  }
  return d;
}
const DEV = deviceId();

/* ---------- normalisation & grading ---------- */
function norm(s){
  return String(s||'')
    .toLowerCase()
    .replace(/[’‘`´]/g,"'")
    .replace(/[“”]/g,'"')
    .replace(/[^a-z0-9' ]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function hasAll(ans, words){ const a=norm(ans); return words.every(w=> a.includes(norm(w))); }
function anyOf(ans, list){ const a=norm(ans); return list.some(x=> a===norm(x) || (norm(x).length>3 && a.includes(norm(x)))); }

function gradeQ(q, val){
  if(q.type==='mcq')   return (val!=null && Number(val)===q.answer) ? q.marks : 0;
  if(q.type==='essay') return null;                       // يُصحَّح من الأستاذ
  const v = String(val||'').trim();
  if(!v) return 0;
  if(q.accept && anyOf(v,q.accept)) return q.marks;
  if(q.keys){
    const sets = Array.isArray(q.keys[0]) ? q.keys : [q.keys];
    if(sets.some(set=> hasAll(v,set))) return q.marks;
    // نصف الدرجة إذا تحقّق نصف المفاتيح على الأقل
    const best = Math.max(...sets.map(set=> set.filter(w=> norm(v).includes(norm(w))).length / set.length));
    if(best>=0.5) return Math.round(q.marks/2);
  }
  return 0;
}

/* ---------- watermark ---------- */
function setWatermark(lines){
  const c=document.createElement('canvas'); const S=2;
  c.width=420*S; c.height=210*S;
  const x=c.getContext('2d'); x.scale(S,S);
  x.translate(210,105); x.rotate(-Math.PI/7); x.translate(-210,-105);
  x.fillStyle='#000'; x.textAlign='center'; x.font='700 15px Cairo, sans-serif';
  x.fillText(lines[0]||'', 210, 95);
  x.font='400 12px Tinos, serif';
  x.fillText(lines[1]||'', 210, 116);
  document.getElementById('wm').style.backgroundImage = `url(${c.toDataURL('image/png')})`;
}

/* ---------- protection ---------- */
let protectOn=false;
function protect(on){
  protectOn=on;
  document.body.classList.toggle('protect', on);
  if(!on) document.getElementById('guard').classList.remove('on');
}
['contextmenu','copy','cut','dragstart','selectstart'].forEach(ev=>{
  document.addEventListener(ev, e=>{
    if(!protectOn) return;
    const t=e.target;
    if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA')) return;
    e.preventDefault();
  }, true);
});
document.addEventListener('keydown', e=>{
  if(!protectOn) return;
  const k=(e.key||'').toLowerCase();
  if((e.ctrlKey||e.metaKey) && ['c','x','s','p','u','a'].includes(k)){
    const t=e.target;
    if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA') && ['c','x','a'].includes(k)) return;
    e.preventDefault();
  }
  if(k==='f12'||(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k))) e.preventDefault();
}, true);
window.addEventListener('blur', ()=>{ if(protectOn) document.getElementById('guard').classList.add('on'); });
window.addEventListener('focus',()=>{ document.getElementById('guard').classList.remove('on'); });
document.addEventListener('visibilitychange', ()=>{
  if(protectOn && document.hidden) document.getElementById('guard').classList.add('on');
});

/* ---------- CONFIG — عدّل هنا فقط ---------- */

  adminHash: "b5ceadfb66801aa7a1b5f12ccf2d9555d1f84476ad10d97704b772bb1ae2f469"

/* ---------- subscriptions store (static JSON + local overrides) ---------- */
let SUBS = {};          // { CODE: {name, phone, expiresAt, active, note} }
let IS_OWNER = false;   // يصبح true بعد إدخال كلمة السر

async function sha256(t){
  const b = new TextEncoder().encode(t);
  const h = await crypto.subtle.digest('SHA-256', b);
  return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* نسخة الأستاذ المحلية من الاشتراكات (قبل رفعها إلى GitHub) */
function localSubs(){ return lsGet('nm_subs_draft', null); }
function saveLocalSubs(o){ lsSet('nm_subs_draft', o); }

/* ارتباط الجهاز — يُخزَّن على جهاز الطالب */
function deviceBinding(code){ return lsGet('nm_bind_'+code, null); }
function bindDevice(code){ lsSet('nm_bind_'+code, {dev:DEV, at:new Date().toISOString()}); }

async function loadSubs(){
  try{
    const r = await fetch(CONFIG.subsUrl + '?t=' + Date.now(), {cache:'no-store'});
    if(r.ok){ const j = await r.json(); SUBS = j.subs || j || {}; }
  }catch(e){ SUBS = {}; }
  const draft = localSubs();
  if(draft) Object.keys(draft).forEach(k => SUBS[k] = draft[k]);   // مسودّة الأستاذ تعلو
}

async function boot(){

  route();

EXAMS.u1 = {"id": "u1", "title": "Unit 1 : Life Choices", "titleAr": "الوحدة الأولى — Life Choices", "duration": 120, "total": 300, "qCount": 39, "page1": [{"title": "I – Read the following text then do the tasks below:", "blocks": [{"t": "text", "v": "The child’s aptitude is a mirror of his/her personality, strengths, and weaknesses. Hence, a designed aptitude test can reveal a lot of information regarding the child that can help in taking a well-informed career selection. It is very difficult to spend your life working in a field that you are not interested in. Courses leading towards a desired career should be found easily for the young to enable them to make right decisions about their future. Psychologists said that it was very easy for a child to get swayed by peer pressure into choosing a career that the majority was opting rather than the one which was best for him/her."}, {"t": "text", "v": "Although it should not be the most important, remuneration of a career holds value in one’s life; nobody likes to earn little. A job’s earnings should match the child’s aspirations and provide a satisfying comfortable life. Modern societies need professionals in every field: utility workers, garbage collectors, farmers, nurses, doctors, engineers, teachers, professors and many others."}, {"t": "text", "v": "Furthermore, demotivation might have a negative impact on the child’s mental health when rejecting all of his/her ideas. Parents can work together to gather information about a career and then help the child in deciding whether it is suitable or not. Most people have dreams of future jobs and there’s no limit to what this could be, but we can’t be absolutely certain about our career choices. Researchers told us that through self-reflection and guided activities, we would find our core values and a clearer path towards the right career."}, {"t": "sub", "v": "Answer the following questions:", "marks": "18 marks"}, {"t": "q", "q": {"n": 1, "type": "open", "marks": 6, "rows": 2, "stem": "What factors should be taken into consideration to decide a future career?", "keys": [["aptitude"], ["interested"], ["courses"], ["peer pressure"], ["remuneration"]], "model": "The child’s aptitude, his/her interest in the field, the courses available for a desired career, peer pressure and the remuneration of the career."}}, {"t": "q", "q": {"n": 2, "type": "open", "marks": 6, "rows": 2, "stem": "What is the influence of peers on children?", "keys": [["swayed"], ["peer pressure"], ["majority"]], "model": "Peers can easily sway a child into choosing the career that the majority is opting for rather than the one which is best for him/her."}}, {"t": "q", "q": {"n": 3, "type": "open", "marks": 6, "rows": 2, "stem": "What do researchers recommend to choose our future career?", "keys": [["self-reflection"], ["self reflection"], ["guided activities"], ["core values"]], "model": "They recommend self-reflection and guided activities, through which we would find our core values and a clearer path towards the right career."}}, {"t": "sub", "v": "Find words in the text which mean the following:", "marks": "12 marks"}, {"t": "q", "q": {"n": 4, "type": "short", "marks": 6, "stem": "natural ability or skill", "accept": ["aptitude"], "model": "aptitude"}}, {"t": "q", "q": {"n": 5, "type": "short", "marks": 6, "stem": "money paid for work or services", "accept": ["remuneration"], "model": "remuneration"}}, {"t": "sub", "v": "Rewrite these sentences about the text to correct the information:", "marks": "12 marks"}, {"t": "q", "q": {"n": 6, "type": "open", "marks": 6, "rows": 2, "stem": "The child’s aptitude is a mirror of his/her hobbies, strengths, and weaknesses.", "keys": [["personality"]], "model": "The child’s aptitude is a mirror of his/her personality, strengths, and weaknesses."}}, {"t": "q", "q": {"n": 7, "type": "open", "marks": 6, "rows": 2, "stem": "Demotivation might have a positive impact on the child’s mental health.", "keys": [["negative"]], "model": "Demotivation might have a negative impact on the child’s mental health."}}]}, {"title": "II- Read the following text then do the tasks below:", "blocks": [{"t": "text", "v": "Man by nature makes mistakes, so be tolerant and seek excuses for those around you, and if someone comes to you with an apology, do not stop him, and do not carry in your heart any envy of anyone. Take care of your health and make it a priority for your entire life. There are no alternatives to exercising, eating well, fresh air and sunshine."}, {"t": "text", "v": "The pursuit of success will make you succeed in the end, no matter how long the period is, but keep trying. Failure is a great teacher in life. It teaches us humility and how to correct our course of life. A great example is Thomas Edison. He failed many times, but he did not give up until he succeeded. Even when he failed, Edison learned something. ‘I get results in everything I try,’ he said."}, {"t": "text", "v": "The golden rule for everybody is to be honest, trustful, useful and generous so that they leave life with a trace that those around them will not forget about."}, {"t": "sub", "v": "Choose the correct answer a, b, c or d :", "marks": "24 marks"}, {"t": "q", "q": {"n": 8, "type": "mcq", "marks": 6, "stem": "Do not carry in your heart any ……. of anyone.", "options": ["envy", "humility", "apology", "pursuit"], "answer": 0}}, {"t": "q", "q": {"n": 9, "type": "mcq", "marks": 6, "stem": "Take care of your health and make it a ……. for your entire life.", "options": ["trace", "priority", "course", "lesson"], "answer": 1}}, {"t": "q", "q": {"n": 10, "type": "mcq", "marks": 6, "stem": "It teaches us humility and how to …… .", "options": ["earn little", "avoid trying", "leave a trace", "correct our course of life"], "answer": 3}}, {"t": "q", "q": {"n": 11, "type": "mcq", "marks": 6, "stem": "He failed many times, but he did not give up until he …… .", "options": ["failed", "succeeded", "gave up", "stopped"], "answer": 1}}, {"t": "sub", "v": "Complete the following sentences with information from the text:", "marks": "12 marks"}, {"t": "q", "q": {"n": 12, "type": "open", "marks": 6, "stem": "Nothing can replace ………", "keys": [["exercising"], ["eating well"], ["fresh air"], ["sunshine"]], "model": "exercising, eating well, fresh air and sunshine."}}, {"t": "q", "q": {"n": 13, "type": "open", "marks": 6, "stem": "The golden rule advises everybody to ………", "keys": [["honest"], ["trustful"], ["generous"]], "model": "be honest, trustful, useful and generous."}}]}], "page2": [{"title": "III- Choose the correct answer a, b, c  or d :", "marks": "54 marks", "blocks": [{"t": "q", "q": {"n": 14, "type": "mcq", "marks": 6, "stem": "It is very important not to …….. our children with unreal expectations.", "options": ["explore", "reveal", "burden", "aspire"], "answer": 2}}, {"t": "q", "q": {"n": 15, "type": "mcq", "marks": 6, "stem": "Everyone endeavours a great deal to make dreams a …….. .", "options": ["real", "really", "realise", "reality"], "answer": 3}}, {"t": "q", "q": {"n": 16, "type": "mcq", "marks": 6, "stem": "A big part of my job is …….. the latest research in medical technology.", "options": ["running into", "getting into", "keeping up with", "following through"], "answer": 2}}, {"t": "q", "q": {"n": 17, "type": "mcq", "marks": 6, "stem": "A position with power and status is attractive …….. me.", "options": ["for", "to", "at", "with"], "answer": 1}}, {"t": "q", "q": {"n": 18, "type": "mcq", "marks": 6, "stem": "…….. the truth, I don’t think I have ever felt that bad.", "options": ["To say", "To tell", "To speak", "To talk"], "answer": 1}}, {"t": "q", "q": {"n": 19, "type": "mcq", "marks": 6, "stem": "Why did she want to take a year …….. ?", "options": ["on", "out", "off", "away"], "answer": 2}}, {"t": "q", "q": {"n": 20, "type": "mcq", "marks": 6, "stem": "He has broken …….. of his legs.", "options": ["all", "each", "every", "both"], "answer": 3}}, {"t": "q", "q": {"n": 21, "type": "mcq", "marks": 6, "stem": "A: I’m thinking of not sitting exams and leaving university.<br>&nbsp;&nbsp;&nbsp;&nbsp;B: ………", "options": ["That’s true. I haven’t thought about that before.", "Yes, you’re right. I’ll do that.", "I’m not sure if this is the best thing to do now.", "Of course! I should’ve thought about that."], "answer": 2}}, {"t": "q", "q": {"n": 22, "type": "mcq", "marks": 6, "stem": "The word which has a final /ɪd/ sound is …..", "options": ["booked", "enjoyed", "visited", "queued"], "answer": 2}}]}, {"title": "IV- Complete the following sentences by filling in each gap with ONE functional word:", "marks": "18 marks", "blocks": [{"t": "q", "q": {"n": 23, "type": "short", "marks": 6, "stem": "I can’t enjoy a job …….. it is quite challenging.", "accept": ["unless"], "model": "unless"}}, {"t": "q", "q": {"n": 24, "type": "short", "marks": 6, "stem": "I don’t know …….. to bring a jacket or not.", "accept": ["whether"], "model": "whether"}}, {"t": "q", "q": {"n": 25, "type": "short", "marks": 6, "stem": "The student …….. guesses correctly is awarded points.", "accept": ["who", "that"], "model": "who"}}]}, {"title": "V- Write suitable questions about the underlined words:", "marks": "24 marks", "blocks": [{"t": "q", "q": {"n": 26, "type": "short", "marks": 8, "stem": "I saw Jack <u>last night</u>.", "accept": ["when did you see jack"], "model": "When did you see Jack?"}}, {"t": "q", "q": {"n": 27, "type": "short", "marks": 8, "stem": "I’ve been using a computer <u>for at least three years</u>.", "accept": ["how long have you been using a computer"], "model": "How long have you been using a computer?"}}, {"t": "q", "q": {"n": 28, "type": "short", "marks": 8, "stem": "Tom is on holiday <u>in Egypt</u> with his wife, Jane, and their children, John and Sally.", "accept": ["where is tom on holiday"], "model": "Where is Tom on holiday?"}}]}, {"title": "VI- Rewrite the following sentences as required in brackets:", "marks": "32 marks", "blocks": [{"t": "q", "q": {"n": 29, "type": "open", "marks": 8, "stem": "George has cut the grass.", "hint": "(Change into passive voice.)", "keys": [["grass", "has been cut"]], "model": "The grass has been cut by George."}}, {"t": "q", "q": {"n": 30, "type": "open", "marks": 8, "stem": "The teacher had told us to prepare carefully for it.", "hint": "(Use a causative verb)", "keys": [["had us prepare"], ["made us prepare"]], "model": "The teacher had us prepare carefully for it."}}, {"t": "q", "q": {"n": 31, "type": "open", "marks": 8, "stem": "I shouldn’t have thought I could pass a test without studying.", "hint": "(use \"I wish\")", "keys": [["i wish", "hadn't thought"], ["i wish", "had not thought"]], "model": "I wish I hadn’t thought I could pass a test without studying."}}, {"t": "q", "q": {"n": 32, "type": "open", "marks": 8, "stem": "Why are you crying?", "hint": "(Report using \"She asked him\")", "keys": [["she asked him why he was crying"], ["asked him why he was crying"]], "model": "She asked him why he was crying."}}]}, {"title": "VII- Correct the verbs in brackets:", "marks": "18 marks", "blocks": [{"t": "q", "q": {"n": 33, "type": "short", "marks": 6, "stem": "I (not / see) him for months.", "accept": ["haven't seen", "have not seen"], "model": "haven’t seen"}}, {"t": "q", "q": {"n": 34, "type": "short", "marks": 6, "stem": "I (visit) Niagara Falls and Stanley Park.", "accept": ["visited"], "model": "visited"}}, {"t": "q", "q": {"n": 35, "type": "short", "marks": 6, "stem": "(you stand) in this queue for a long time?", "accept": ["have you been standing"], "model": "Have you been standing"}}]}, {"title": "VIII- Complete the following sentences using clauses:", "marks": "12 marks", "blocks": [{"t": "q", "q": {"n": 36, "type": "open", "marks": 6, "stem": "If you run into any trouble, …………", "keys": [["give me a call"], ["call me"], ["help"]], "model": "If you run into any trouble, just give me a call."}}, {"t": "q", "q": {"n": 37, "type": "open", "marks": 6, "stem": "When the test day came, …………", "keys": [["confident"], ["i was"], ["do well"]], "model": "When the test day came, I was confident I would do well."}}]}, {"title": "IX- Translation:", "marks": "14 marks", "blocks": [{"t": "sub", "v": "Translate the following sentence into Arabic:", "marks": ""}, {"t": "q", "q": {"n": 38, "type": "open", "marks": 7, "ar": true, "rows": 2, "stem": "I want a job that allows me to contribute to society.", "keys": [["عمل"], ["وظيفة"]], "model": "أريدُ عملاً يتيح لي أن أُسهِمَ في خدمة المجتمع."}}, {"t": "sub", "v": "Translate the following sentence into English:", "marks": ""}, {"t": "q", "q": {"n": 39, "type": "open", "marks": 7, "rows": 2, "stem": "يؤدّي الآباءُ دوراً حيوياً في تطوير المسار المهنيّ لأبنائهم -", "keys": [["parents", "vital role"], ["parents", "important role"], ["parents", "career development"]], "model": "Parents play a vital role in the career development of their children."}}]}, {"title": "X- Write a composition of no less than 80 words on ONE of the following topics:", "marks": "50 marks", "blocks": [{"t": "note", "v": "<b>Topic 1:</b> The job you would like to do after graduation.<br><b>Topic 2:</b> An important decision that changed your life."}, {"t": "q", "q": {"n": 0, "type": "essay", "marks": 50, "rows": 10, "stem": "اكتب تعبيرك هنا (لا يقلّ عن 80 كلمة):", "model": "يُصحَّح التعبير من الأستاذ. أرسله عبر واتساب للحصول على التصحيح والملاحظات."}}]}]};
EXAMS.u2 = {"id": "u2", "title": "Unit 2 : Success", "titleAr": "الوحدة الثانية — Success", "duration": 120, "total": 300, "qCount": 39, "page1": [{"title": "I – Read the following text then do the tasks below:", "blocks": [{"t": "text", "v": "One of the most destructive moments in our lives is failure. When we work hard and keep faith with clear heart and soul to accomplish something and fail, it will surely have negative consequences for our lives. When we fail, life turns upside down. Everything seems to disappear into thin air. However, most people don’t realise that failure acts as a stepping-stone towards success. They don’t know that we can learn more about our lives when we fail. Throughout history, there have been many famous people who had once the greatest failures in their lives, but later they could learn from their experience and were able to reach the top."}, {"t": "text", "v": "Thomas Edison is by far one of the most famous inventors in history. He holds 1,093 patents to his name. However, when attempting to invent a commercially-viable electric lightbulb, he failed over 10,000 times. When asked by a reporter how it felt to fail so many times, he merely stated, “I have not failed 10,000 times. I have not failed once. I have succeeded in proving that those 10,000 ways will not work. When I have eliminated the ways that will not work, I will find the way that will work.”"}, {"t": "text", "v": "Albert Einstein, one of the greatest thinkers of our time, didn’t speak until he was four-years old. He also failed his entrance exam to the Swiss Federal Polytechnic school located in Zurich at sixteen-years old. And, even his father, up until the time of his death, considered his son to be a major failure. After eventually graduating from college, Einstein actually worked as an insurance salesman, but quit after some time because he failed at that as well."}, {"t": "sub", "v": "Answer the following questions:", "marks": "18 marks"}, {"t": "q", "q": {"n": 1, "type": "open", "marks": 6, "rows": 2, "stem": "What are the good sides and bad sides of failures?", "keys": [["stepping-stone"], ["stepping stone"], ["negative consequences"], ["learn"]], "model": "Bad sides: failure is destructive and has negative consequences; life turns upside down. Good sides: failure acts as a stepping-stone towards success and we learn more about our lives."}}, {"t": "q", "q": {"n": 2, "type": "open", "marks": 6, "rows": 2, "stem": "How did Edison react to his failures?", "keys": [["not failed"], ["eliminated"], ["succeeded in proving"]], "model": "He stated that he had not failed 10,000 times but had succeeded in proving that those 10,000 ways would not work."}}, {"t": "q", "q": {"n": 3, "type": "open", "marks": 6, "rows": 2, "stem": "How did Einstein’s father see his son? Did he change his mind towards him later?", "keys": [["major failure"], ["failure"]], "model": "Up until the time of his death, his father considered his son to be a major failure; he never changed his mind."}}, {"t": "sub", "v": "Find words in the text which mean the following:", "marks": "12 marks"}, {"t": "q", "q": {"n": 4, "type": "short", "marks": 6, "stem": "a means of progress or advancement", "accept": ["stepping-stone", "stepping stone"], "model": "stepping-stone"}}, {"t": "q", "q": {"n": 5, "type": "short", "marks": 6, "stem": "put an end to or get rid of", "accept": ["eliminated", "eliminate"], "model": "eliminated"}}, {"t": "sub", "v": "Rewrite these sentences about the text to correct the information:", "marks": "12 marks"}, {"t": "q", "q": {"n": 6, "type": "open", "marks": 6, "rows": 2, "stem": "Thomas Edison failed over 1,000 times when attempting to invent a lightbulb.", "keys": [["10 000"], ["10,000"], ["10000"]], "model": "Thomas Edison failed over 10,000 times when attempting to invent a lightbulb."}}, {"t": "q", "q": {"n": 7, "type": "open", "marks": 6, "rows": 2, "stem": "Einstein failed his entrance exam to the Swiss Federal Polytechnic school at fourteen-years old.", "keys": [["sixteen"]], "model": "Einstein failed his entrance exam to the Swiss Federal Polytechnic school at sixteen-years old."}}]}, {"title": "II- Read the following text then do the tasks below:", "blocks": [{"t": "text", "v": "Timing also is a crucial ingredient to success. The only method of obtaining good timing is through repetition or experience. Furthermore, one needs confidence to be successful. He has to start with smaller tasks that have a higher chance of success to build up confidence. Parents should help their young children to build up confidence and become successful and happy in their life. They should discover at an early age the talents of their children and help them to grow their gift and take care of their needs and interests."}, {"t": "text", "v": "Actions are louder than words. When you take action, you trigger all kinds of things that will inevitably carry you to success. Every step taken by you in the direction of your dreams and goals brings you closer at jet speed. Nothing happens until you take action. To be successful, you have to do what successful people do. All highly successful people are highly action-oriented people. It is said: “Success is 10% inspiration and 90 % perspiration.”"}, {"t": "text", "v": "The golden rule to achieve success is to keep learning. These are three dangerous words: “I know that.” If you have read or heard about something, you do not know. If you are not rich and successful the way you want, then you do not know. Become a ‘learn it all’ rather than ‘know it all’."}, {"t": "sub", "v": "Choose the correct answer a, b, c or d :", "marks": "24 marks"}, {"t": "q", "q": {"n": 8, "type": "mcq", "marks": 6, "stem": "Timing also is a crucial ……. to success.", "options": ["ingredient", "method", "action", "rule"], "answer": 0}}, {"t": "q", "q": {"n": 9, "type": "mcq", "marks": 6, "stem": "The only method of obtaining good timing is through ……. or experience.", "options": ["confidence", "preparation", "repetition", "action"], "answer": 2}}, {"t": "q", "q": {"n": 10, "type": "mcq", "marks": 6, "stem": "Every step taken by you in the direction of your dreams and goals brings you closer at ……. speed.", "options": ["light", "train", "car", "jet"], "answer": 3}}, {"t": "q", "q": {"n": 11, "type": "mcq", "marks": 6, "stem": "The golden rule to achieve success is to keep ……. .", "options": ["waiting", "learning", "talking", "dreaming"], "answer": 1}}, {"t": "sub", "v": "Complete the following sentences with information from the text:", "marks": "12 marks"}, {"t": "q", "q": {"n": 12, "type": "open", "marks": 6, "stem": "Nothing takes place until you ………", "keys": [["take action"], ["action"]], "model": "take action."}}, {"t": "q", "q": {"n": 13, "type": "open", "marks": 6, "stem": "Parents should find out at an early age ………", "keys": [["talents"]], "model": "the talents of their children."}}]}], "page2": [{"title": "III- Choose the correct answer a, b, c  or d :", "marks": "54 marks", "blocks": [{"t": "q", "q": {"n": 14, "type": "mcq", "marks": 6, "stem": "Throughout his career, he won a …….. fortune of billions of dollars.", "options": ["bankrupt", "insurance", "mind-boggling", "stepping-stone"], "answer": 2}}, {"t": "q", "q": {"n": 15, "type": "mcq", "marks": 6, "stem": "He …….. useless methods until he finally succeeded.", "options": ["elimination", "eliminate", "eliminated", "eliminating"], "answer": 2}}, {"t": "q", "q": {"n": 16, "type": "mcq", "marks": 6, "stem": "I’m going to …….. learning Chinese because it’s too difficult.", "options": ["take up", "give up", "carry on", "join"], "answer": 1}}, {"t": "q", "q": {"n": 17, "type": "mcq", "marks": 6, "stem": "I’m sorry …….. what happened.", "options": ["for", "about", "of", "with"], "answer": 1}}, {"t": "q", "q": {"n": 18, "type": "mcq", "marks": 6, "stem": "This is our fifth win in the game! We are …….. .", "options": ["on a roll", "dead in the water", "backing the wrong horse", "acing a test"], "answer": 0}}, {"t": "q", "q": {"n": 19, "type": "mcq", "marks": 6, "stem": "In a few years our company should be able to …….. the world’s most developed nations.", "options": ["ace a test", "back the wrong horse", "be dead in the water", "join the ranks of"], "answer": 3}}, {"t": "q", "q": {"n": 20, "type": "mcq", "marks": 6, "stem": "Some expressions are used in both formal …….. informal situations to congratulate somebody on an achievement.", "options": ["or", "nor", "and", "but"], "answer": 2}}, {"t": "q", "q": {"n": 21, "type": "mcq", "marks": 6, "stem": "A: My boss offered me a promotion, and I took it.<br>&nbsp;&nbsp;&nbsp;&nbsp;B: ………", "options": ["That’s great! Congratulations.", "I’m sorry about what happened.", "You mustn’t let this depress you.", "I have no doubt that you’ll do much better next time."], "answer": 0}}, {"t": "q", "q": {"n": 22, "type": "mcq", "marks": 6, "stem": "The word which has a final /ɪd/ sound is …..", "options": ["washed", "called", "needed", "phoned"], "answer": 2}}]}, {"title": "IV- Complete the following sentences by filling in each gap with ONE functional word:", "marks": "18 marks", "blocks": [{"t": "q", "q": {"n": 23, "type": "short", "marks": 6, "stem": "When she came into the room, the burglar …….. already left.", "accept": ["had"], "model": "had"}}, {"t": "q", "q": {"n": 24, "type": "short", "marks": 6, "stem": "She made us excited about the subject …….. she was so interested herself.", "accept": ["because", "as", "since"], "model": "because"}}, {"t": "q", "q": {"n": 25, "type": "short", "marks": 6, "stem": "In fact, there are some factors …….. help us be successful.", "accept": ["which", "that"], "model": "which"}}]}, {"title": "V- Write suitable questions about the underlined words:", "marks": "24 marks", "blocks": [{"t": "q", "q": {"n": 26, "type": "short", "marks": 8, "stem": "It happened <u>at four in the afternoon</u> when she was watching news on TV.", "accept": ["when did it happen"], "model": "When did it happen?"}}, {"t": "q", "q": {"n": 27, "type": "short", "marks": 8, "stem": "He holds <u>1,093</u> patents to his name.", "accept": ["how many patents does he hold"], "model": "How many patents does he hold?"}}, {"t": "q", "q": {"n": 28, "type": "short", "marks": 8, "stem": "Times were hard and the family had been struggling <u>for some time</u>.", "accept": ["how long had the family been struggling"], "model": "How long had the family been struggling?"}}]}, {"title": "VI- Rewrite the following sentences as required in brackets:", "marks": "32 marks", "blocks": [{"t": "q", "q": {"n": 29, "type": "open", "marks": 8, "stem": "Scientists announced the launch of the new drug last week.", "hint": "(Change into passive voice.)", "keys": [["was announced"]], "model": "The launch of the new drug was announced last week (by scientists)."}}, {"t": "q", "q": {"n": 30, "type": "open", "marks": 8, "stem": "Somehow her enthusiasm inspired me, and I started to like biology.", "hint": "(Use a causative verb)", "keys": [["made me like"], ["got me to like"]], "model": "Somehow her enthusiasm made me like biology."}}, {"t": "q", "q": {"n": 31, "type": "open", "marks": 8, "stem": "I didn’t get the results I was hoping for in my exams.", "hint": "(use \"I wish\")", "keys": [["i wish", "had got"], ["i wish", "had gotten"]], "model": "I wish I had got the results I was hoping for in my exams."}}, {"t": "q", "q": {"n": 32, "type": "open", "marks": 8, "stem": "What time did you wake up?", "hint": "(Report using \"He asked her\")", "keys": [["asked her what time she had woken up"], ["asked her what time she woke up"]], "model": "He asked her what time she had woken up."}}]}, {"title": "VII- Correct the verbs in brackets:", "marks": "18 marks", "blocks": [{"t": "q", "q": {"n": 33, "type": "short", "marks": 6, "stem": "I (prepare) lunch when he came.", "accept": ["was preparing"], "model": "was preparing"}}, {"t": "q", "q": {"n": 34, "type": "short", "marks": 6, "stem": "She (work) as a waitress for three years when he met her.", "accept": ["had been working"], "model": "had been working"}}, {"t": "q", "q": {"n": 35, "type": "short", "marks": 6, "stem": "The lecture (start) by the time they got there.", "accept": ["had started"], "model": "had started"}}]}, {"title": "VIII- Complete the following sentences using clauses:", "marks": "12 marks", "blocks": [{"t": "q", "q": {"n": 36, "type": "open", "marks": 6, "stem": "By the time the boss left his office, …………", "keys": [["had"]], "model": "By the time the boss left his office, everybody had gone home."}}, {"t": "q", "q": {"n": 37, "type": "open", "marks": 6, "stem": "Maha was playing the guitar when …………", "keys": [["lights"], ["went"], ["came"]], "model": "Maha was playing the guitar when the lights went out."}}]}, {"title": "IX- Translation:", "marks": "14 marks", "blocks": [{"t": "sub", "v": "Translate the following sentence into Arabic:", "marks": ""}, {"t": "q", "q": {"n": 38, "type": "open", "marks": 7, "ar": true, "rows": 2, "stem": "Some people define success by measures such as wealth, position or status and one’s capabilities.", "keys": [["النجاح"]], "model": "يُعرّفُ بعضُ الناس النجاحَ بمعاييرَ مثل الثروة أو المنصب أو المكانة وقدرات المرء."}}, {"t": "sub", "v": "Translate the following sentence into English:", "marks": ""}, {"t": "q", "q": {"n": 39, "type": "open", "marks": 7, "rows": 2, "stem": "سيضعُكَ ذلك في أفضل موقعٍ لتنفيذ المهمة بأقلّ صعوبة -", "keys": [["best position", "task"], ["set you", "position"]], "model": "It will set you in the best position to execute the task with the least difficulty."}}]}, {"title": "X- Write a composition of no less than 80 words on ONE of the following topics:", "marks": "50 marks", "blocks": [{"t": "note", "v": "<b>Topic 1:</b> A personal experience in which you failed but then you could achieve your target.<br><b>Topic 2:</b> Someone who has influenced you to be the best version."}, {"t": "q", "q": {"n": 0, "type": "essay", "marks": 50, "rows": 10, "stem": "اكتب تعبيرك هنا (لا يقلّ عن 80 كلمة):", "model": "يُصحَّح التعبير من الأستاذ. أرسله عبر واتساب للحصول على التصحيح والملاحظات."}}]}]};
</script>
<script>
/* ============================================================
   VIEWS
   ============================================================ */
function render(html){ $('#app').innerHTML = html; }

/* ---------- gate ---------- */
function viewGate(){
  protect(false);
  render(`
  <div class="center card pad">
    <h2 class="t">الدخول إلى المنصة</h2>
    <p class="s">أدخل رمز الاشتراك الذي وصلك عبر واتساب. الرمز يعمل على جهاز واحد فقط.</p>

    <label class="fl">رمز الاشتراك</label>
    <input id="g-code" class="inp code" maxlength="9" placeholder="XXXX-XXXX" autocomplete="off">

    <div style="height:14px"></div>
    <button class="btn" id="g-go">دخول</button>

    <div class="note err" id="g-err"></div>

    <div class="hr"></div>
    <p class="s" style="margin:0 0 10px">ليس لديك رمز؟</p>
    <button class="btn ghost" id="g-trial">تجربة مجانية (مرة واحدة)</button>
    <a class="wa" href="${CONFIG.waLink}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.7 14.9L2 22l5.3-1.4A10 10 0 1012 2zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.2-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.2-.3.6-.4.8-.4h.6c.2 0 .5 0 .7.5l.9 2.2c.1.2.1.4 0 .6l-.4.5c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.8-1c.2-.2.4-.2.6-.1l2 1c.3.1.5.2.5.4 0 .1 0 .7-.3 1.4z"/></svg>
      اطلب رمز اشتراك عبر واتساب
    </a>
    <p class="muted" style="text-align:center;margin-top:12px">
      تلغرام: <a href="${CONFIG.tgLink}" target="_blank" rel="noopener">@HaniAkram</a>
      &nbsp;•&nbsp; واتساب: <span class="en">+${CONFIG.waNumber}</span>
    </p>
    <div class="hr"></div><button class="btn ghost" id="g-admin" style="opacity:.65;font-size:13px">لوحة تحكّم الأستاذ</button>
  </div>`);

  const inp=$('#g-code');
  inp.addEventListener('input', ()=>{
    let v=inp.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
    inp.value = v.length>4 ? v.slice(0,4)+'-'+v.slice(4) : v;
  });
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') $('#g-go').click(); });
  $('#g-go').onclick = tryEnter;
  $('#g-trial').onclick = startTrial;
  $('#g-admin').onclick = adminLogin;
}

function gerr(msg){ const n=$('#g-err'); n.textContent=msg; n.className='note err on'; }

async function tryEnter(){
  const code = $('#g-code').value.trim().toUpperCase();
  if(code.length<9) return gerr('أدخل الرمز كاملاً.');
  const sub = SUBS[code];
  if(!sub) return gerr('الرمز غير صحيح. تأكّد منه أو تواصل عبر واتساب.');
  if(sub.active===false) return gerr('هذا الاشتراك موقوف. تواصل مع الأستاذ.');
  if(daysLeft(sub.expiresAt) < 0)
    return gerr('انتهت مدة اشتراكك بتاريخ '+fmtDate(sub.expiresAt)+'. أرسل وصل الدفع عبر واتساب ليُجدَّد الرمز نفسه.');

  const b = deviceBinding(code);
  if(!b){ bindDevice(code); }
  else if(b.dev !== DEV){
    return gerr('هذا الرمز مُفعَّل على جهاز آخر. لفكّ الارتباط تواصل مع الأستاذ عبر واتساب.');
  }

  S.sub = Object.assign({code}, sub);
  S.trial = false;
  viewHome();
}

function startTrial(){
  if(lsGet('nm_trial',false)) return gerr('تم استخدام التجربة المجانية على هذا الجهاز. للاشتراك تواصل عبر واتساب.');
  S.sub = { code:'TRIAL', name:'تجربة مجانية', phone:'—', expiresAt: todayISO() };
  S.trial = true;
  viewHome();
}

/* ---------- home ---------- */
function viewHome(){
  protect(false);
  const s=S.sub;
  const list = Object.values(EXAMS).map(x=>`
    <div class="card pad" style="margin-bottom:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap">
      <div>
        <div style="font-weight:800;font-size:16px">${esc(x.titleAr)}</div>
        <div class="muted en" style="direction:ltr">${esc(x.title)}</div>
        <div class="muted" style="margin-top:4px">${x.total} درجة • ${x.duration} دقيقة • ${x.qCount} سؤالاً</div>
      </div>
      <button class="btn sm" data-x="${x.id}">ابدأ الامتحان</button>
    </div>`).join('');

  render(`
    <div style="max-width:760px;margin:16px auto">
      <div class="card pad" style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
          <div>
            <div style="font-weight:800;font-size:17px">${esc(s.name||'طالب')}</div>
            <div class="muted">${S.trial ? 'وضع التجربة المجانية — نموذج واحد فقط'
              : 'الرمز: <span class="en">'+esc(s.code)+'</span> • ينتهي في '+fmtDate(s.expiresAt)+' (باقٍ '+daysLeft(s.expiresAt)+' يوماً)'}</div>
          </div>
          <button class="btn ghost sm" id="h-out">خروج</button>
        </div>
      </div>
      ${list}
      <p class="muted" style="text-align:center;margin-top:18px">
        الامتحان محميّ بعلامة مائية باسمك ورقمك. النسخ والطباعة والتصوير ممنوعة.
      </p>
    </div>`);

  $('#h-out').onclick = ()=>{ S.sub=null; viewGate(); };
  document.querySelectorAll('[data-x]').forEach(b=> b.onclick = ()=> startExam(b.dataset.x));
}

/* ---------- exam ---------- */
function startExam(id){
  const x = EXAMS[id]; if(!x) return;
  S.exam=x; S.answers={}; S.started=Date.now(); S.endsAt = Date.now() + x.duration*60000;
  setWatermark([ (S.sub.name||'طالب') + ' — ' + (S.sub.phone||''), S.sub.code + ' · ' + new Date().toLocaleString('en-GB') ]);
  protect(true);
  viewExam();
  tick();
  S.timer = setInterval(tick, 1000);
}

function tick(){
  const left = Math.max(0, S.endsAt - Date.now());
  const t=$('#timer'); if(!t) return;
  const m=Math.floor(left/60000), sec=Math.floor(left/1000)%60;
  t.textContent = pad(Math.floor(m/60))+':'+pad(m%60)+':'+pad(sec);
  t.classList.toggle('low', left < 10*60000);
  if(left<=0){ clearInterval(S.timer); submitExam(true); }
}

function qHTML(q){
  if(q.type==='mcq'){
    return `<div class="q" data-q="${q.n}">
      <div class="stem">${q.n}- ${q.stem}</div>
      <div class="opts">${q.options.map((o,i)=>`
        <label class="opt" data-i="${i}"><input type="radio" name="q${q.n}" value="${i}"><span>${'abcd'[i]}. ${o}</span></label>`).join('')}</div>
    </div>`;
  }
  const rows = q.rows||1;
  const cls  = q.ar ? 'ans ar' : 'ans';
  const inp  = rows>1
    ? `<textarea class="${cls}" rows="${rows}" data-in="${q.n}" placeholder="اكتب إجابتك هنا"></textarea>`
    : `<input class="${cls}" data-in="${q.n}" placeholder="اكتب إجابتك هنا">`;
  return `<div class="q" data-q="${q.n}">
      <div class="stem">${q.n?q.n+"- ":""}${q.stem}</div>${q.hint?`<div class="stem" style="font-weight:700;padding-inline-start:18px">${q.hint}</div>`:''}
      ${inp}
    </div>`;
}

function secHTML(sec){
  let h = `<div class="sec"><h3>${sec.title}${sec.marks?` <span class="mk">(${sec.marks})</span>`:''}</h3>`;
  (sec.blocks||[]).forEach(b=>{
    if(b.t==='text') h += `<p class="txt">${b.v}</p>`;
    if(b.t==='sub')  h += `<div class="sub-h">- ${b.v}${b.marks?`   <span class="mk">(${b.marks})</span>`:''}</div>`;
    if(b.t==='q')    h += qHTML(b.q);
    if(b.t==='note') h += `<div class="stem" style="font-weight:700">${b.v}</div>`;
  });
  return h+'</div>';
}

function viewExam(){
  const x=S.exam;
  render(`
  <div class="paperhead">
    <div class="ph-l">
      <span class="pill">${esc(x.titleAr)}</span>
      <span class="muted">${x.total} درجة</span>
    </div>
    <div class="ph-l">
      <span id="timer">--:--:--</span>
      <button class="btn sm" id="e-submit">تسليم الامتحان</button>
    </div>
  </div>
  <div class="paper">
    <div class="cols">${x.page1.map(secHTML).join('')}${x.page2.map(secHTML).join('')}</div>
    <div class="footpad"></div>
    <div class="actions">
      <button class="btn" id="e-submit2">تسليم الامتحان وعرض النتيجة</button>
      <button class="btn ghost" id="e-quit">إنهاء بدون تسليم</button>
    </div>
  </div>`);

  document.querySelectorAll('.opt').forEach(o=>{
    o.addEventListener('click', ()=>{
      const q=o.closest('.q').dataset.q;
      o.closest('.opts').querySelectorAll('.opt').forEach(z=>z.classList.remove('sel'));
      o.classList.add('sel');
      o.querySelector('input').checked=true;
      S.answers[q]=Number(o.dataset.i);
    });
  });
  document.querySelectorAll('[data-in]').forEach(i=>{
    i.addEventListener('input', ()=> S.answers[i.dataset.in]=i.value);
  });
  $('#e-submit').onclick = ()=> submitExam(false);
  $('#e-submit2').onclick = ()=> submitExam(false);
  $('#e-quit').onclick = ()=>{ if(confirm('إنهاء الامتحان بدون تسليم؟')){ clearInterval(S.timer); protect(false); viewHome(); } };
}

/* ---------- results ---------- */
async function submitExam(auto){
  if(!auto && !confirm('هل أنت متأكد من تسليم الامتحان؟ لا يمكن التعديل بعد التسليم.')) return;
  clearInterval(S.timer);
  const x=S.exam;
  const all=[]; [...x.page1,...x.page2].forEach(s=>(s.blocks||[]).forEach(b=>{ if(b.t==='q') all.push(b.q); }));

  let got=0, autoTotal=0, pending=0;
  const rows = all.map(q=>{
    const val=S.answers[q.n];
    const sc=gradeQ(q,val);
    if(sc===null){ pending+=q.marks; }
    else { autoTotal+=q.marks; got+=sc; }
    return {q,val,sc};
  });
  const pct = autoTotal? Math.round(got/autoTotal*100) : 0;

  protect(false);
  if(S.trial) lsSet('nm_trial', true);
  const hist = lsGet('nm_attempts', []);
  hist.unshift({ code:S.sub.code, name:S.sub.name||'', phone:S.sub.phone||'', exam:x.id, examTitle:x.titleAr,
    got, autoTotal, pct, pending, at:new Date().toISOString(),
    minutes: Math.round((Date.now()-S.started)/60000) });
  lsSet('nm_attempts', hist.slice(0,120));

  const list = rows.map(r=>{
    const q=r.q;
    const yours = q.type==='mcq'
      ? (r.val!=null ? 'abcd'[r.val]+'. '+q.options[r.val] : '—')
      : (String(r.val||'').trim() || '—');
    const model = q.type==='mcq' ? 'abcd'[q.answer]+'. '+q.options[q.answer] : (q.model||(q.accept?q.accept[0]:''));
    const tag = r.sc===null ? '<span class="tag rev">يُصحَّح من الأستاذ</span>'
              : r.sc===q.marks ? '<span class="tag ok">'+q.marks+'/'+q.marks+'</span>'
              : '<span class="tag no">'+r.sc+'/'+q.marks+'</span>';
    return `<div class="rrow">
      <div class="rn">${q.n}</div>
      <div class="rb">
        <div class="yours">${esc(yours)}</div>
        ${r.sc===q.marks && q.type==='mcq' ? '' : `<div class="model">✓ ${esc(model)}</div>`}
      </div>${tag}</div>`;
  }).join('');

  render(`
  <div style="max-width:820px;margin:16px auto">
    <div class="score" style="margin-bottom:16px">
      <b>${got} / ${autoTotal}</b>
      <span>${pct}% — التصحيح الآلي • ${pending} درجة (التعبير) تُصحَّح من الأستاذ</span>
    </div>
    <div class="card pad">
      <h2 class="t">التصحيح التفصيلي</h2>
      <p class="s">إجابتك بالرمادي، والإجابة النموذجية بالأخضر.</p>
      ${list}
    </div>
    <div class="actions">
      <button class="btn" id="r-home">العودة إلى النماذج</button>
      <a class="btn ghost" style="text-decoration:none;width:auto;min-width:160px" href="${CONFIG.waLink}" target="_blank" rel="noopener">أرسل تعبيرك للأستاذ للتصحيح</a>
    </div>
  </div>`);
  $('#r-home').onclick = ()=> S.trial ? viewGate() : viewHome();
  window.scrollTo(0,0);
}

/* ============================================================
   ADMIN  (يعمل محلياً ثم تُصدَّر البيانات إلى GitHub)
   ============================================================ */
let ADMIN_TAB='subs';

async function adminLogin(){
  const p = prompt('كلمة سر لوحة التحكّم:');
  if(p===null) return;
  const h = await sha256(p);
  if(h !== CONFIG.adminHash) return gerr('كلمة السر غير صحيحة.');
  IS_OWNER = true;
  viewAdmin();
}

function draft(){ return localSubs() || JSON.parse(JSON.stringify(SUBS)); }
function commitDraft(d){ saveLocalSubs(d); SUBS = Object.assign({}, SUBS, d); }

function viewAdmin(){
  protect(false);
  render(`<div style="max-width:1000px;margin:16px auto">
    <div class="tabs">
      <button class="tab ${ADMIN_TAB==='subs'?'on':''}" data-t="subs">الاشتراكات</button>
      <button class="tab ${ADMIN_TAB==='new'?'on':''}" data-t="new">إضافة اشتراك</button>
      <button class="tab ${ADMIN_TAB==='pub'?'on':''}" data-t="pub">النشر إلى GitHub</button>
      <button class="tab ${ADMIN_TAB==='att'?'on':''}" data-t="att">المحاولات</button>
      <button class="tab" data-t="pw">تغيير كلمة السر</button>
      <button class="tab" data-t="exit">عرض كطالب</button>
    </div>
    <div id="adm"></div>
  </div>`);
  document.querySelectorAll('[data-t]').forEach(btn=> btn.onclick=()=>{
    const t=btn.dataset.t;
    if(t==='exit'){ IS_OWNER=false; return viewGate(); }
    if(t==='pw')   return admPw();
    ADMIN_TAB=t; viewAdmin();
  });
  if(ADMIN_TAB==='subs') admSubs();
  if(ADMIN_TAB==='new')  admNew();
  if(ADMIN_TAB==='pub')  admPub();
  if(ADMIN_TAB==='att')  admAtt();
}

async function admPw(){
  const p = prompt('اكتب كلمة السر الجديدة:');
  if(!p) return;
  const h = await sha256(p);
  $('#adm').innerHTML = `<div class="card pad">
    <h2 class="t">بصمة كلمة السر الجديدة</h2>
    <p class="s">افتح ملف <b class="en">index.html</b> في GitHub، وابحث عن <b class="en">adminHash</b>، والصق هذه القيمة مكان القديمة ثم احفظ.</p>
    <textarea class="ans" rows="3" readonly>${esc(h)}</textarea>
    <div style="height:12px"></div><button class="btn" id="pw-c">نسخ البصمة</button></div>`;
  $('#pw-c').onclick = ()=>{ navigator.clipboard && navigator.clipboard.writeText(h); $('#pw-c').textContent='تم النسخ ✓'; };
}

function admSubs(){
  const d = draft();
  const list = Object.keys(d).map(k=>Object.assign({code:k}, d[k]));
  list.sort((x,y)=> (x.expiresAt||'').localeCompare(y.expiresAt||''));
  const rows = list.map(su=>{
    const dl = daysLeft(su.expiresAt||'2000-01-01');
    const ok = su.active!==false && dl>=0;
    return `<tr>
      <td class="mono">${esc(su.code)}</td>
      <td>${esc(su.name||'')}<div class="muted en" style="direction:ltr">${esc(su.phone||'')}</div></td>
      <td>${fmtDate(su.expiresAt)}<div class="muted">${ok?('باقٍ '+dl+' يوم'):'منتهٍ'}</div></td>
      <td><span class="chip ${ok?'a':'e'}">${ok?'فعّال':'منتهٍ/موقوف'}</span></td>
      <td style="white-space:nowrap">
        <button class="btn sm" data-r="${esc(su.code)}" data-d="30">+30</button>
        <button class="btn sm ghost" data-r="${esc(su.code)}" data-d="7">+7</button>
        <button class="btn sm ghost" data-w="${esc(su.code)}">واتساب</button>
        <button class="btn sm danger" data-x="${esc(su.code)}">${su.active===false?'تفعيل':'إيقاف'}</button>
      </td></tr>`;
  }).join('');
  $('#adm').innerHTML = `<div class="card pad">
    <h2 class="t">الاشتراكات (${list.length})</h2>
    <p class="s">التجديد يُبقي الرمز نفسه ويمدّد تاريخ الانتهاء فقط. بعد أي تعديل انتقل إلى تبويب «النشر إلى GitHub».</p>
    <div class="tblwrap"><table>
      <tr><th>الرمز</th><th>الطالب</th><th>الانتهاء</th><th>الحالة</th><th>إجراءات</th></tr>
      ${rows||'<tr><td colspan="5" class="muted">لا توجد اشتراكات بعد.</td></tr>'}
    </table></div>
    <div class="note ok" id="a-msg"></div></div>`;

  const msg=t=>{ const n=$('#a-msg'); n.textContent=t; n.className='note ok on'; };
  document.querySelectorAll('[data-r]').forEach(btn=> btn.onclick=()=>{
    const dd=draft(), c=btn.dataset.r;
    const base = Math.max(Date.now(), new Date((dd[c].expiresAt||todayISO())+'T23:59:59').getTime());
    dd[c].expiresAt = new Date(base + Number(btn.dataset.d)*86400000).toISOString().slice(0,10);
    commitDraft(dd); admSubs(); msg('تم تجديد الرمز '+c+' — لا تنسَ النشر إلى GitHub.');
  });
  document.querySelectorAll('[data-x]').forEach(btn=> btn.onclick=()=>{
    const dd=draft(), c=btn.dataset.x;
    dd[c].active = (dd[c].active===false);
    commitDraft(dd); admSubs();
  });
  document.querySelectorAll('[data-w]').forEach(btn=> btn.onclick=()=>{
    const c=btn.dataset.w, su=draft()[c];
    const txt = 'رمز دخولك إلى منصة نماذج امتحانية:\n'+c+'\nصالح حتى '+fmtDate(su.expiresAt)+'\nيعمل على جهاز واحد فقط.';
    window.open(CONFIG.waLink + '?text=' + encodeURIComponent(txt), '_blank');
  });
}

function admNew(){
  $('#adm').innerHTML = `<div class="card pad">
    <h2 class="t">إضافة اشتراك جديد</h2>
    <p class="s">أنشئ الرمز، أرسله عبر واتساب، ثم انشر التعديل إلى GitHub.</p>
    <div class="grid2">
      <div><label class="fl">اسم الطالب</label><input class="inp" id="n-name" placeholder="مثال: محمد علي"></div>
      <div><label class="fl">رقم الموبايل</label><input class="inp en" id="n-phone" placeholder="09xxxxxxxx"></div>
      <div><label class="fl">الرمز</label>
        <div style="display:flex;gap:8px"><input class="inp code" id="n-code" value="${rndCode()}" maxlength="9">
        <button class="btn sm ghost" id="n-gen">توليد</button></div></div>
      <div><label class="fl">المدة (أيام)</label><input class="inp en" id="n-days" value="30" type="number" min="1"></div>
    </div>
    <label class="fl">ملاحظة (اختياري)</label><input class="inp" id="n-note" placeholder="مثال: دفع نقداً 15/9">
    <div style="height:16px"></div>
    <button class="btn" id="n-save">إنشاء الاشتراك</button>
    <div class="note ok" id="n-msg"></div></div>`;
  $('#n-gen').onclick = ()=> $('#n-code').value = rndCode();
  $('#n-save').onclick = ()=>{
    const code=$('#n-code').value.trim().toUpperCase();
    const name=$('#n-name').value.trim(), phone=$('#n-phone').value.trim();
    const days=Math.max(1, Number($('#n-days').value||30));
    const n=$('#n-msg');
    if(code.length<9 || !name){ n.className='note err on'; n.textContent='أدخل الاسم والرمز كاملاً.'; return; }
    const dd=draft();
    if(dd[code]){ n.className='note err on'; n.textContent='هذا الرمز مستخدم من قبل.'; return; }
    const exp=new Date(Date.now()+days*86400000).toISOString().slice(0,10);
    dd[code] = { name, phone, expiresAt:exp, active:true, note:$('#n-note').value.trim(), createdAt:todayISO() };
    commitDraft(dd);
    const txt='رمز دخولك إلى منصة نماذج امتحانية:\n'+code+'\nصالح حتى '+fmtDate(exp)+'\nيعمل على جهاز واحد فقط.';
    n.className='note ok on';
    n.innerHTML='تم الإنشاء. الرمز: <b class="en">'+esc(code)+'</b> — صالح حتى '+fmtDate(exp)+
      ' &nbsp;<a href="'+CONFIG.waLink+'?text='+encodeURIComponent(txt)+'" target="_blank" rel="noopener">أرسله عبر واتساب</a>'+
      '<br>انتقل إلى تبويب «النشر إلى GitHub» لتثبيت التعديل.';
    $('#n-code').value=rndCode(); $('#n-name').value=''; $('#n-phone').value=''; $('#n-note').value='';
  };
}

function admPub(){
  const d = draft();
  const json = JSON.stringify({updated:new Date().toISOString(), subs:d}, null, 2);
  $('#adm').innerHTML = `<div class="card pad">
    <h2 class="t">النشر إلى GitHub</h2>
    <p class="s">انسخ المحتوى التالي والصقه كاملاً في ملف <b class="en">data/subs.json</b> داخل مستودعك ثم اضغط Commit. خلال دقيقة يصبح ساري المفعول لكل الطلاب.</p>
    <textarea class="ans" id="pb-j" rows="14" readonly>${esc(json)}</textarea>
    <div class="actions">
      <button class="btn" id="pb-c">نسخ المحتوى</button>
      <button class="btn ghost" id="pb-d">تنزيل الملف</button>
      <button class="btn ghost" id="pb-r">تجاهل التعديلات المحلية</button>
    </div>
    <div class="note warn on" style="margin-top:14px">
      ما دمت لم تنشر، فالتعديلات محفوظة على هذا المتصفح فقط ولا يراها الطلاب.
    </div></div>`;
  $('#pb-c').onclick = ()=>{ navigator.clipboard && navigator.clipboard.writeText(json); $('#pb-c').textContent='تم النسخ ✓'; };
  $('#pb-d').onclick = ()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    a.download='subs.json'; a.click();
  };
  $('#pb-r').onclick = ()=>{ if(confirm('حذف التعديلات المحلية والعودة إلى النسخة المنشورة؟')){
    try{ localStorage.removeItem('nm_subs_draft'); }catch(e){} location.reload(); } };
}

function admAtt(){
  const docs = lsGet('nm_attempts', []);
  $('#adm').innerHTML = `<div class="card pad">
    <h2 class="t">المحاولات على هذا الجهاز (${docs.length})</h2>
    <p class="s">الاستضافة الثابتة لا تجمع نتائج الطلاب مركزياً؛ يظهر هنا ما جرى على هذا الجهاز فقط.</p>
    <div class="tblwrap"><table>
      <tr><th>التاريخ</th><th>الطالب</th><th>النموذج</th><th>النتيجة</th><th>الزمن</th></tr>
      ${docs.map(a=>`<tr><td>${fmtDate(a.at)}</td>
        <td>${esc(a.name||'')}<div class="muted en" style="direction:ltr">${esc(a.code||'')}</div></td>
        <td>${esc(a.examTitle||'')}</td>
        <td><b class="en">${a.got}/${a.autoTotal}</b> <span class="muted">(${a.pct}%)</span></td>
        <td class="muted">${a.minutes} د</td></tr>`).join('')
        || '<tr><td colspan="5" class="muted">لا توجد محاولات بعد.</td></tr>'}
    </table></div></div>`;
}

/* ---------- router ---------- */
function route(){
  if(!Object.keys(EXAMS).length){
    render('<div class="card pad center">لم يتم تحميل النماذج.</div>'); return;
  }
  viewGate();
}
boot();
</script>
</body>
</html>
